# This file is managed by ServiceBot plugin - Semaphore. The content in this file is created using a common
# template and configurations in service.yml.
# Any modifications made to version, name, agent, and global_job_config will be overwritten by the generated
# content in nightly runs. Code changes made to the remaining sections will not be affected.
version: v1.0
name: build-test-release
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-1

auto_cancel:
  running:
    when: "branch != 'main'"

execution_time_limit:
  hours: 1

queue:
  - when: "branch != 'main'"
    processing: parallel

global_job_config:
  prologue:
    commands:
      - checkout

blocks:
  # --- Static Analysis ---
  - name: "Static Analysis (TypeScript & ESLint)"
    dependencies: []
    # Skip on main when the push is a release merge (see the stable tests' skip below)
    skip:
      when: "branch = 'main' and change_in(['/release.svg', '/.versions/next.txt'], {pipeline_file: 'ignore', default_branch: 'main'})"
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-amd64-1
      prologue:
        commands:
          - npm ci --prefer-offline --include=dev
      jobs:
        - name: "TypeScript Check"
          commands:
            - npx gulp check
        - name: "ESLint"
          commands:
            - npx gulp lint
      epilogue:
        always:
          commands:
            - echo "Static analysis completed"

  # --- Build & Test (multi-platform/-arch) for VS Code (stable) ---
  - name: "Linux x64 Stable: Tests"
    dependencies: ["Static Analysis (TypeScript & ESLint)"]
    # Skip on main when:
    # - change in the release.svg file, signaling a `chore: none version bump vN.N.N` commit.
    # - change in the .versions/next.txt file, signaling a release PR merge commit.
    # Release branches run these too, since `change_in` there would match every push since the
    # branch was cut (see the release block below).
    skip: &build-test-skip-stable
      when: "branch = 'main' and change_in(['/release.svg', '/.versions/next.txt'], {pipeline_file: 'ignore', default_branch: 'main'})"
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-amd64-1
      prologue: &build-test-prologue
        commands:
          - make ci-bin-sem-cache-restore
          - |
            if [[ "${SEMAPHORE_ORGANIZATION_URL}" == *".semaphoreci.com" ]]; then
              echo "Skipping Vault setup for Semaphore CI"
            else
              . vault-setup --version v3 --role vscode
              . vault-get-secret vscodeextension/testing
            fi
      jobs: &build-test-jobs
        - name: "Mocha: Unit Tests (VS Code)"
          commands:
            - make test-mocha
          env_vars:
            - name: VSCODE_VERSION
              value: stable
        - name: "Playwright: Webview Tests (VS Code)"
          commands:
            - make test-playwright-webviews
        - name: "Playwright: E2E Smoke Tests (VS Code)"
          commands:
            - make test-playwright-e2e TEST_SUITE=@smoke
      epilogue: &build-test-epilogue
        always:
          commands:
            - make remove-test-env
            - make ci-bin-sem-cache-store
            - make store-test-results-to-semaphore
            # Upload coverage artifacts for the SonarQube analysis block
            - |
              if [ -f "coverage/lcov.info" ]; then
                artifact push workflow coverage/lcov.info --force
                echo "Uploaded Mocha coverage artifacts"
              fi
            - |
              if [ -f "coverage/lcov-functional.info" ]; then
                artifact push workflow coverage/lcov-functional.info --force
                echo "Uploaded Playwright coverage artifacts"
              fi
            # Bundle Mocha test results + logs into a single triage artifact
            - make store-test-logs-to-semaphore
            # Upload Playwright artifacts if available
            - |
              PLATFORM_ARCH="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/darwin/macos/')-$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')"
              if [ -d test-results ]; then
                artifact push workflow test-results --destination test-results-${PLATFORM_ARCH} --force
              fi
              if [ -d playwright-report ]; then
                artifact push workflow playwright-report --destination playwright-report-${PLATFORM_ARCH} --force
              fi

  - name: "Linux ARM64 Stable: Tests"
    dependencies: ["Static Analysis (TypeScript & ESLint)"]
    skip: *build-test-skip-stable
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-arm64-1
      prologue: *build-test-prologue
      jobs: *build-test-jobs
      epilogue: *build-test-epilogue

  - name: "Windows x64 Stable: Tests"
    dependencies: ["Static Analysis (TypeScript & ESLint)"]
    skip: *build-test-skip-stable
    task:
      agent:
        machine:
          type: s1-windows-2025-amd64-4
      prologue:
        commands:
          - make ci-bin-sem-cache-restore
          - $Env:PATH += ";C:\Program Files\Git\bin"
          - $Env:PATH += ";C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64"
          # Ensure npm and npx are available
          - npm --version
          - npx --version
          - choco install gh -y
          - $Env:PATH += ";C:\Program Files\GitHub CLI\"
          - gh --version
          - |
            if (Test-Path "$HOME/.gh-token") {
              $Env:GH_TOKEN = Get-Content "$HOME/.gh-token" -Raw | ForEach-Object { $_.Trim() }
              if ([string]::IsNullOrEmpty($Env:GH_TOKEN)) {
                  Write-Error "Token file exists but is empty"
                  exit 1
              }
              gh config set prompt disabled
              $Env:GH_TOKEN | gh auth login --with-token
              gh auth status
            } else {
                Write-Error "Token file not found at $HOME/.gh-token"
                exit 1
            }
          - |
            if ($Env:SEMAPHORE_ORGANIZATION_URL -like "*.semaphoreci.com") {
              Write-Output "Skipping Vault setup for Semaphore CI"
            } else {
              $Env:VAULT_ADDR = "https://non-prod.vault.internal.confluent.cloud"
              $token = $(vault write -field=token "auth/stag/semaphore/login" role="vscode" jwt="$Env:SEMAPHORE_OIDC_TOKEN")
              vault login -no-print token=$token
            }
          - |
            $E2E_USERNAME = $(vault kv get -field=E2E_USERNAME stag/kv/semaphore/vscodeextension/testing)
            Set-Content -Path .env -Value "E2E_USERNAME=$E2E_USERNAME"
            $E2E_PASSWORD = $(vault kv get -field=E2E_PASSWORD stag/kv/semaphore/vscodeextension/testing)
            Add-Content -Path .env -Value "E2E_PASSWORD=$E2E_PASSWORD"
      jobs:
        - name: "Mocha: Unit Tests (VS Code)"
          commands:
            - npm ci --prefer-offline --include=dev
            - npx playwright install
            - npx gulp ci
            - npx gulp test
            # Note: Functional tests (npx gulp functional) are not run on Windows due to Playwright/browser automation issues
          env_vars:
            - name: VSCODE_VERSION
              value: stable
        - name: "Playwright: E2E Smoke Tests (VS Code)"
          commands:
            - npm ci --prefer-offline --include=dev
            - npx playwright install
            - npx gulp e2e -t "@smoke"
      epilogue:
        always:
          commands:
            - Remove-Item .env -ErrorAction SilentlyContinue
            # Windows version of store-test-results-to-semaphore
            - |
              Write-Output "Publishing test results to Semaphore..."
              $TestResultFileName = 'TEST-result.xml'
              if (Test-Path $TestResultFileName) {
                  Write-Output "Publishing Mocha test results from $(Resolve-Path $TestResultFileName)"
                  test-results publish $TestResultFileName --force
              } else {
                  Write-Output "Mocha test results not found at $(Join-Path -Path $PWD -ChildPath $TestResultFileName)"
              }
              $TestResultE2EFileName = 'TEST-result-e2e.xml'
              if (Test-Path $TestResultE2EFileName) {
                  Write-Output "Publishing E2E test results from $(Resolve-Path $TestResultE2EFileName)"
                  test-results publish $TestResultE2EFileName --name 'VS Code (stable) Extension Tests: E2E (win32 x64)' --force
              } else {
                  Write-Output "E2E test results not found at $(Join-Path -Path $PWD -ChildPath $TestResultE2EFileName)"
              }
              $TestResultWebviewFileName = 'TEST-result-webview.xml'
              if (Test-Path $TestResultWebviewFileName) {
                  Write-Output "Publishing Webview test results from $(Resolve-Path $TestResultWebviewFileName)"
                  test-results publish $TestResultWebviewFileName --name 'Webview Tests' --force
              } else {
                  Write-Output "Webview test results not found at $(Join-Path -Path $PWD -ChildPath $TestResultWebviewFileName)"
              }
            # Bundle Mocha test results + logs into a single triage artifact
            - |
              $triageZip = "test-results-mocha-windows-x64.zip"
              $filesToZip = @("TEST-result.xml", "TEST-extension.log", "TEST-sidecar.log") |
                  Where-Object { Test-Path $_ }
              if ($filesToZip.Count -gt 0) {
                  Compress-Archive -Path $filesToZip -DestinationPath $triageZip -Force
                  artifact push workflow $triageZip `
                    --destination "test-results-mocha/$triageZip" --force
                  Write-Output "Uploaded $triageZip"
              }

  # --- End Build & Test (multi-platform/-arch) for VS Code (stable) ---

  # --- SonarQube Analysis ---
  - name: "SonarQube Analysis"
    dependencies: ["Linux x64 Stable: Tests"]
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-amd64-1
      prologue:
        commands:
          - make ci-bin-sem-cache-restore
          - |
            if [[ "${SEMAPHORE_ORGANIZATION_URL}" == *".semaphoreci.com" ]]; then
              echo "Skipping Vault setup for Semaphore CI"
            else
              . vault-setup --version v3 --role vscode
              . vault-get-secret vscodeextension/testing
            fi
      jobs:
        - name: "Run SonarQube scan with coverage data"
          commands:
            # Download coverage artifacts from the Linux x64 Stable tests
            - |
              if artifact pull workflow lcov.info; then
                echo "Downloaded Mocha coverage artifacts"
                mkdir -p coverage
                mv lcov.info coverage/
              else
                echo "Warning: Mocha coverage artifacts not found"
              fi
            - |
              if artifact pull workflow lcov-functional.info; then
                echo "Downloaded Playwright coverage artifacts"
                mkdir -p coverage
                mv lcov-functional.info coverage/
              else
                echo "Warning: Playwright coverage artifacts not found"
              fi
            # Verify coverage files exist
            - |
              echo "Coverage files found:"
              ls -la coverage/ || echo "No coverage directory found"
            # Run SonarQube scan with all available coverage data
            - sem-version java 17
            - emit-sonarqube-data --run_only_sonar_scan --enable_sonarqube_enterprise

  # --- End SonarQube Analysis ---

  # --- Build & Test (multi-platform/-arch) for VS Code (insiders) ---
  - name: "Linux x64 Insiders: Tests"
    dependencies: ["Static Analysis (TypeScript & ESLint)"]
    # Skip on release branches, so an Insiders failure can't hold up release packaging
    skip: &build-test-skip-insiders
      when: >
        branch =~ '^v[0-9]+\.[0-9]+\.x$'
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-amd64-1
      prologue: *build-test-prologue
      jobs:
        - name: "Mocha: Unit Tests (VS Code Insiders)"
          commands:
            - make test-mocha
          env_vars:
            - name: VSCODE_VERSION
              value: insiders
        - name: "Playwright: Webview Tests (VS Code Insiders)"
          commands:
            - make test-playwright-webviews
      epilogue: *build-test-epilogue

  - name: "Linux ARM64 Insiders: Tests"
    dependencies: ["Static Analysis (TypeScript & ESLint)"]
    skip: *build-test-skip-insiders
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-arm64-1
      prologue: *build-test-prologue
      jobs:
        - name: "Mocha: Unit Tests (VS Code Insiders)"
          commands:
            - make test-mocha
          env_vars:
            - name: VSCODE_VERSION
              value: insiders
        - name: "Playwright: Webview Tests (VS Code Insiders)"
          commands:
            - make test-playwright-webviews
      epilogue: *build-test-epilogue

  - name: "Bump microversion"
    dependencies:
      - "Linux x64 Stable: Tests"
    skip:
      # For main branch:    Always bump microversion on every commit (except those that bump next.txt
      #                       to set the next version under development)
      # For release branches: Skip bumping microversion on `chore: none version bump vN.N.N` commits (release commits)
      #                       and on merge commits that bump `next.txt` file (releases current version and prepares for next version).
      #                       The job makes that check itself, since `change_in` can't limit it to this push's commits
      #                       (see the release block below).
      # For pull requests:    Skips on all pull requests.
      when: >
        (branch = 'main' and change_in('/.versions/next.txt', {pipeline_file: 'ignore', default_branch: 'main'}))
        or pull_request =~ '.*'
    task:
      jobs:
        - name: "Bump microversion and commit (no tag)"
          commands:
            - |
              if [[ "$SEMAPHORE_GIT_BRANCH" =~ ^v[0-9]+\.[0-9]+\.x$ ]] \
                && .semaphore/scripts/changed-in-push.sh release.svg .versions/next.txt; then
                echo "This push on $SEMAPHORE_GIT_BRANCH is a release, which bumps its own microversion. Skipping."
              else
                make bump-microversion
              fi

  - name: "Set next version under development"
    dependencies:
      - "Linux x64 Stable: Tests"
    run:
      when: "branch = 'main' and change_in('/.versions/next.txt', {pipeline_file: 'ignore', default_branch: 'main'})"
    task:
      jobs:
        - name: "Set next version under development"
          commands:
            # Sets the next version under development with microversion set to 1
            - MICROVERSION_POST=-1 make bump-microversion

  # We always release from a release branch, and never directly from main
  - name: "[Release branch] Release current version and prepare for next version"
    dependencies: []
    run:
      # IMPORTANT: The job checks that this push changed next.txt, using only the commit(s) in the push that
      #            triggered the pipeline (.semaphore/scripts/changed-in-push.sh). `change_in` can't do that here:
      #            on non-main branches it examines commits back to the common ancestor with main, so it would
      #            match a next.txt change from a previous push and release again. Its per-push range option
      #            used to fix that, but spc now fails every PR pipeline at initialization when any `change_in`
      #            sets it (https://github.com/semaphoreci/spc/pull/62).
      #            Reference: https://docs.semaphore.io/reference/conditions-dsl
      when: >
        branch =~ '^v[0-9]+\.[0-9]+\.x$'
    task:
      jobs:
        - name: "Release current version and prepare for next version"
          commands:
            - |
              rc=0
              .semaphore/scripts/changed-in-push.sh .versions/next.txt || rc=$?
              if [ "$rc" -eq 0 ]; then
                # Release the current version, then prepare for the next version under development
                make release-current-version && make bump-microversion
              elif [ "$rc" -eq 2 ]; then
                # fail loudly rather than let a release-PR merge pass without releasing
                echo "Can't tell whether this push changed .versions/next.txt. Check the push, then rerun or release by hand." >&2
                false
              else
                echo "This push didn't change .versions/next.txt. Nothing to release."
              fi

  - name: "Validate Release PR"
    dependencies: []
    run:
      when: "pull_request =~ '.*' and change_in('/.versions/next.txt', {pipeline_file: 'ignore', default_branch: 'main'})"
    task:
      jobs:
      - name: "Release"
        commands:
          # In builds triggered by a Pull Request, the value of the SEMAPHORE_GIT_BRANCH
          # is the name of the git branch targeted by the Pull Request.
          - export GIT_BRANCH=$SEMAPHORE_GIT_BRANCH
          - make validate-bump

after_pipeline:
  task:
    jobs:
      - name: Publish Test Results to Semaphore
        commands:
          - test-results gen-pipeline-report || echo "Could not publish pipeline test result report due to probably no test results to publish"

promotions:
  - name: Multi-Arch VSIX Packaging and Upload
    pipeline_file: multi-arch-packaging.yml
    auto_promote:
      # multi-arch-packaging.yml only packages and uploads when this commit is a tagged release
      when: >
        result = 'passed' and branch =~ '^v[0-9]+\.[0-9]+\.x$'
  - name: Third Party Notices
    pipeline_file: third-party-notices.yml
    auto_promote:
      # on release branches this matches every push since the branch was cut, so
      # third-party-notices.yml also checks the push's own commits
      when: "branch =~ '.*' and change_in(['/package.json', '/NOTICE.txt', '/scripts/notices/NOTICE-vsix_PREAMBLE.txt'], {default_branch: 'main', pipeline_file: 'ignore'})"
  - name: Validate Sidecar Version
    pipeline_file: validate-sidecar-version.yml
    auto_promote:
      # on release branches this matches every push since the branch was cut, which is fine for a
      # read-only check
      when: "result = 'passed' and change_in(['/.versions/ide-sidecar.txt', '/src/clients/sidecar-openapi-specs/sidecar.openapi.yaml'], {default_branch: 'main', pipeline_file: 'ignore'})"
  - name: Run Playwright E2E Tests
    pipeline_file: playwright-e2e.yml
    parameters:
      env_vars:
        - name: TEST_SUITE
          default_value: "@smoke|@topic-message-viewer|@evolve-schema|@produce-message-to-topic|@project-scaffolding|@flink-statements|@direct-connection-crud|@flink-artifacts|@flink-udfs"
          description: "Playwright E2E test tags to run, separated by |. By default, runs the smoketests and CUJ-related tests."
        - name: VSCODE_VERSION
          default_value: "stable"
          description: "VS Code version to test against (stable, insiders, or a specific version)."
        - name: PLATFORM
          default_value: "all"
          options:
            - "all"
            - "linux"
            - "windows"
          description: "Which platform(s) to run: all, linux, or windows."
